<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<title>登录 · Navio Server</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="card">
      <div class="logo"><span>M</span></div>
      <h1>Navio Server</h1>
      <p class="sub">书签导航 · 私有部署 · 文件存储</p>

      <form id="form" autocomplete="on">
        <label for="user">账号</label>
        <div class="field">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="user" name="username" type="text" placeholder="用户名" autocomplete="username" required autofocus>
        </div>

        <label for="pw">密码</label>
        <div class="field">
          <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="pw" name="password" type="password" placeholder="密码" autocomplete="current-password" required>
          <button type="button" id="eye" title="显示密码">👁</button>
        </div>

        <div id="msg" class="msg hidden"></div>
        <button id="submit" class="submit" type="submit">登 录</button>
      </form>

      <div class="foot">
        <span id="srv">正在连接…</span>
        <span class="dot">·</span>
        <span>数据保存在宿主机本地文件</span>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
